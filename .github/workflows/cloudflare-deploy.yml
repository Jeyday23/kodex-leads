name: Deploy Cloudflare Worker

on:
  push:
    branches:
      - staging
  workflow_dispatch:
    inputs:
      environment:
        description: Cloudflare environment to deploy
        required: true
        default: staging
        type: choice
        options:
          - staging
          - production

permissions:
  contents: read

env:
  DEPLOY_ENVIRONMENT: ${{ github.event_name == 'push' && 'staging' || inputs.environment }}

concurrency:
  group: cloudflare-${{ github.event_name == 'push' && 'staging' || inputs.environment }}
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy ${{ github.event_name == 'push' && 'staging' || inputs.environment }}
    runs-on: ubuntu-latest
    environment: ${{ github.event_name == 'push' && 'staging' || inputs.environment }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci
        env:
          AGENT_REACH_INSTALL: "0"

      - name: Validate Worker
        run: npm run cf:check

      - name: Test Worker
        run: npm run cf:test

      - name: Deploy Worker
        run: npx wrangler deploy --env "$DEPLOY_ENVIRONMENT"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
