services:
  - type: web
    name: kodex-leads-staging
    runtime: node
    plan: starter
    branch: staging
    buildCommand: npm ci && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NEXT_PUBLIC_SITE_URL
        sync: false
      - key: NEXT_PUBLIC_SUPABASE_URL
        sync: false
      - key: NEXT_PUBLIC_SUPABASE_ANON_KEY
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: CRON_SECRET
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: OPENAI_MODEL
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: CLAUDE_MODEL
        sync: false
      - key: PERPLEXITY_API_KEY
        sync: false
      - key: PERPLEXITY_MODEL
        sync: false
      - key: GOOGLE_SEARCH_CONSOLE_CLIENT_EMAIL
        sync: false
      - key: GOOGLE_SEARCH_CONSOLE_PRIVATE_KEY
        sync: false
      - key: GOOGLE_SEARCH_CONSOLE_SITE_URL
        sync: false
      - key: SEO_SOURCE_FETCH_ENABLED
        sync: false
      - key: SLACK_WEBHOOK_URL
        sync: false
      - key: HUBSPOT_PRIVATE_APP_TOKEN
        sync: false
      - key: AIRTABLE_ACCESS_TOKEN
        sync: false
      - key: AIRTABLE_BASE_ID
        sync: false
      - key: AIRTABLE_DEALS_TABLE_ID
        sync: false
      - key: AIRTABLE_TASKS_TABLE_ID
        sync: false
      - key: FOUNDER_OPS_GITHUB_REPOSITORY
        sync: false
      - key: GITHUB_TOKEN
        sync: false

  - type: worker
    name: kodex-authority-monitoring-worker
    runtime: node
    plan: starter
    branch: staging
    buildCommand: npm ci
    startCommand: npx tsx workers/monitoring-worker.ts
    envVars:
      - key: NEXT_PUBLIC_SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: OPENAI_MODEL
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: CLAUDE_MODEL
        sync: false
      - key: PERPLEXITY_API_KEY
        sync: false
      - key: PERPLEXITY_MODEL
        sync: false
      - key: SLACK_WEBHOOK_URL
        sync: false

  - type: worker
    name: kodex-authority-autopilot-worker
    runtime: node
    plan: starter
    branch: staging
    buildCommand: npm ci
    startCommand: npx tsx workers/autopilot-worker.ts
    envVars:
      - key: NEXT_PUBLIC_SITE_URL
        sync: false
      - key: NEXT_PUBLIC_SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: CRON_SECRET
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: OPENAI_MODEL
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: CLAUDE_MODEL
        sync: false
      - key: PERPLEXITY_API_KEY
        sync: false
      - key: PERPLEXITY_MODEL
        sync: false
      - key: GOOGLE_SEARCH_CONSOLE_CLIENT_EMAIL
        sync: false
      - key: GOOGLE_SEARCH_CONSOLE_PRIVATE_KEY
        sync: false
      - key: GOOGLE_SEARCH_CONSOLE_SITE_URL
        sync: false
      - key: SEO_SOURCE_FETCH_ENABLED
        sync: false
      - key: SLACK_WEBHOOK_URL
        sync: false
      - key: HUBSPOT_PRIVATE_APP_TOKEN
        sync: false

cronJobs:
