# Kodex Leads - Render blueprint
#
# Two complete, parallel stacks:
#   * -staging    -> tracks branch `staging`
#   * -production -> tracks branch `main`
#
# Every secret is declared `sync: false` and must be filled in the Render
# dashboard. Staging and production never share an env var group, so a
# staging credential can never be read by a production service (or vice versa).
#
# Persistence is Supabase, not a Render-managed database. Each environment must
# point at its OWN Supabase project via its own `-core` env group; there is
# deliberately no `databases:` block because nothing in this repo connects to a
# Render Postgres instance. See docs/ENVIRONMENT_SETUP.md.
#
# Production autonomy ships OFF: AUTOPILOT_SCHEDULE_ENABLED=false,
# SEO_SOURCE_FETCH_ENABLED=false, LEAD_AUTOMATION_ENABLED=false and
# MEDIA_PROVIDER=queue-only are pinned literals, not dashboard-editable syncs.
# Flip them only after a manual production run has been reviewed.

services:
  # ---------------------------------------------------------------- staging
  - type: web
    name: kodex-leads-staging
    runtime: node
    plan: starter
    branch: staging
    buildCommand: npm ci && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVarGroups:
      - kodex-leads-staging-core
      - kodex-leads-staging-automation-secrets
      - kodex-leads-staging-integrations
      - kodex-leads-staging-founder-ops
    envVars:
      - key: AUTOPILOT_SCHEDULE_ENABLED
        sync: false
      - key: SEO_SOURCE_FETCH_ENABLED
        sync: false
      - key: MEDIA_PROVIDER
        value: "queue-only"

  - type: worker
    name: kodex-authority-monitoring-worker-staging
    runtime: node
    plan: starter
    branch: staging
    buildCommand: npm ci
    startCommand: npx tsx workers/monitoring-worker.ts
    envVarGroups:
      - kodex-leads-staging-core
      - kodex-leads-staging-integrations
    envVars:
      - key: AUTOPILOT_SCHEDULE_ENABLED
        sync: false

  - type: worker
    name: kodex-authority-autopilot-worker-staging
    runtime: node
    plan: starter
    branch: staging
    buildCommand: npm ci
    startCommand: npx tsx workers/autopilot-worker.ts
    envVarGroups:
      - kodex-leads-staging-core
      - kodex-leads-staging-automation-secrets
      - kodex-leads-staging-integrations
    envVars:
      - key: AUTOPILOT_SCHEDULE_ENABLED
        sync: false
      - key: SEO_SOURCE_FETCH_ENABLED
        sync: false

  # ---------------------------------------------------------------- production
  - type: web
    name: kodex-leads-production
    runtime: node
    plan: starter
    branch: main
    buildCommand: npm ci && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVarGroups:
      - kodex-leads-production-core
      - kodex-leads-production-automation-secrets
      - kodex-leads-production-integrations
      - kodex-leads-production-founder-ops
    envVars:
      - key: AUTOPILOT_SCHEDULE_ENABLED
        value: "false"
      - key: SEO_SOURCE_FETCH_ENABLED
        value: "false"
      - key: MEDIA_PROVIDER
        value: "queue-only"

  - type: worker
    name: kodex-authority-monitoring-worker-production
    runtime: node
    plan: starter
    branch: main
    buildCommand: npm ci
    startCommand: npx tsx workers/monitoring-worker.ts
    envVarGroups:
      - kodex-leads-production-core
      - kodex-leads-production-integrations
    envVars:
      - key: AUTOPILOT_SCHEDULE_ENABLED
        value: "false"

  - type: worker
    name: kodex-authority-autopilot-worker-production
    runtime: node
    plan: starter
    branch: main
    buildCommand: npm ci
    startCommand: npx tsx workers/autopilot-worker.ts
    envVarGroups:
      - kodex-leads-production-core
      - kodex-leads-production-automation-secrets
      - kodex-leads-production-integrations
    envVars:
      - key: AUTOPILOT_SCHEDULE_ENABLED
        value: "false"
      - key: SEO_SOURCE_FETCH_ENABLED
        value: "false"

